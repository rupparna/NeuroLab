<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>NeuroLab - My First Neuron</title>
    <style>
      body {
        margin: 0;
        background-color: #0b0f19;
        color: #00f3ff;
        font-family: Arial, sans-serif;
        text-align: center;
      }
      h1{
        margin-top: 20px;
        letter-spacing: 2px;

      }

      #lab-screen{
      background-color: #111827;
      border: 2px solid #00f3ff;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
      margin-top: 20px;
      cursor: pointer;
      }
      p {
      color: #94a3b8;
      font-size: 14px;
    }
    </style>
    </head>
    <body>
      
      <h1> NEUROLAB//SIMULATOR</h1>
      <p>Click anywhere inside the box to spawn a neuron </p>
      <canvas id="lab-screen" width="600" height="400"></canvas>

      <script>
        const canvas = document.getElementById('lab-screen');
        const ctx = canvas.getContext("2d");
        let neurons = [];
        let pulses = [];
        function drawNeuron(neuron) {
          ctx.beginPath();
          ctx.arc(neuron.x, neuron.y, 25, 0, Math.PI * 2);
          
          ctx.fillStyle = neuron.isFiring > 0 ? "rgba(255, 255, 255, 0.6)" : "rgba(0, 243, 255, 0.2)";
          ctx.fill();

          ctx.beginPath();
          ctx.arc(neuron.x, neuron.y, 12, 0, Math.PI * 2);
          // Make the core white if firing
          ctx.fillStyle = neuron.isFiring > 0 ? "#ffffff" : "#00f3ff";
          ctx.fill();
          
          
          if (neuron.isFiring > 0) neuron.isFiring -= 1;

          ctx.fillStyle = "#94a3b8";
          ctx.font = "12px Arial";
          ctx.fillText(Math.round(neuron.voltage) + " mV", neuron.x - 15, neuron.y -35);
        }

        function drawNetwork() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          
          if(neurons.length > 1){
            ctx.beginPath();
            ctx.moveTo(neurons[0].x, neurons[0].y);
            for (let i = 1; i < neurons.length; i++) {
              ctx.lineTo(neurons[i].x, neurons[i].y);
            }
            ctx.strokeStyle = "rgba(0, 243, 255, 0.5)";
            ctx.lineWidth = 2;
            ctx.stroke();
          }
          for (let i = 0; i < neurons.length; i++){
            let n = neurons[i];

            if (n.voltage > -70) {
              n.voltage -= 0.1; 
            } else if (n.voltage < -70) {
              n.voltage += 0.5; 
            }

            if (n.voltage >= -55 && n.isFiring === 0){
              n.isFiring = 20; 
              n.voltage = -90;
              
              if (i + 1 < neurons.length) {
                pulses.push({ 
                  fromIndex: i,
                  toIndex: i + 1,
                  progress: 0
              
                });
              }
            }
            drawNeuron(n);
            }
          for(let i = pulses.length - 1; i >= 0; i--){
            let p=pulses[i];
            let start=neurons[p.fromIndex];
            let end=neurons[p.toIndex];
        

        p.progress += 0.02;
        let currentX = start.x + (end.x - start.x) * p.progress;
        let currentY = start.y + (end.y - start.y) * p.progress;

        ctx.beginPath();
        ctx.arc(currentX, currentY, 6, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "#00f3ff";
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.shadowBlur = 0;

        if (p.progress >= 1) {
              end.voltage += 20; 
              end.isFiring = 20; 
              pulses.splice(i, 1);
            }
      }
    }
        canvas.addEventListener('click', function(event) {
          const rect = canvas.getBoundingClientRect();
          const clickX = event.clientX - rect.left;
          const clickY = event.clientY - rect.top;

         neurons.push({ x: clickX, y: clickY, voltage: -70, isFiring: 0 });
         if (neurons.length > 1) {
            pulses.push({ 
              fromIndex: neurons.length - 2,
              toIndex: neurons.length - 1,
              progress: 0
            });
          }
         function loop() {
          drawNetwork();
          requestAnimationFrame(loop);
        }
       });

    neurons.push({ x: 300, y: 200, voltage: -70, isFiring: 0 });
    
    function loop() {
      drawNetwork();
      requestAnimationFrame(loop);
    }
    loop(); 
    
  </script>
    </body>
    </html>
